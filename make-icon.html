<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สร้างไอคอนสีทองไร้ขอบขาว (512x512) - ศกศ.ตราด</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; }
    .preview-box { padding: 16px; border-radius: 24px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6); }
    canvas { display: block; border-radius: 20px; }
    button { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: bold; border: none; padding: 12px 28px; border-radius: 10px; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <h2>✨ พรีวิวไอคอนสีทองเต็มผืน (ไร้ขอบขาวบน Android)</h2>
  
  <div class="preview-box">
    <canvas id="iconCanvas" width="512" height="512"></canvas>
  </div>
  
  <button onclick="downloadIcon()">⬇️ ดาวน์โหลดไฟล์ logo.png</button>

  <script>
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');

    const centerX = 256;
    const centerY = 256;
    const radius = 215; // ขนาดเหรียญทองใน Safe Zone ป้องกันโดนตัดขอบ

    // 1. เทพื้นหลังสีทองเต็มผืน 512x512 พิกเซล (แก้ปัญหามุมขาวถาวร)
    const baseGrad = ctx.createRadialGradient(180, 160, 40, centerX, centerY, 360);
    baseGrad.addColorStop(0, '#FEE48B');
    baseGrad.addColorStop(0.5, '#D48B16');
    baseGrad.addColorStop(1, '#8C5103');
    ctx.fillStyle = baseGrad;
    ctx.fillRect(0, 0, 512, 512);

    // 2. วาดมิติเงาหลุม 3 มิติรอบเหรียญ
    ctx.save();
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius + 8, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
    ctx.fill();
    ctx.restore();

    // 3. วาดเหรียญทองวงกลมนูนมิติ 3D ตรงกลาง
    const coinGrad = ctx.createRadialGradient(190, 170, 30, centerX, centerY, radius);
    coinGrad.addColorStop(0, '#FFFDF0');   // แสงไฮไลต์สีทองสว่าง
    coinGrad.addColorStop(0.3, '#FEE48B'); // สีทองนวล
    coinGrad.addColorStop(0.7, '#E5A623'); // สีทองอร่าม
    coinGrad.addColorStop(1, '#B87309');    // ขอบทองเข้ม

    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fillStyle = coinGrad;
    ctx.fill();

    // เส้นขอบเหรียญ 3 มิติ (Double Rim)
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius - 3, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
    ctx.lineWidth = 3.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(centerX, centerY, radius - 14, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(124, 74, 3, 0.35)";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 4. วาดภาพตราทางการให้อยู่ตรงกลางเหรียญอย่างสวยงาม
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = "https://lh3.googleusercontent.com/d/1kLyYDJNV7hYAD0YERRxW8GEgJNB-XplP";

    img.onload = () => {
      const targetHeight = 310;
      const targetWidth = (img.width / img.height) * targetHeight;
      const x = (512 - targetWidth) / 2;
      const y = (512 - targetHeight) / 2 + 2;

      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 6;
      ctx.drawImage(img, x, y, targetWidth, targetHeight);
      ctx.restore();
    };

    function downloadIcon() {
      const link = document.createElement('a');
      link.download = 'logo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
