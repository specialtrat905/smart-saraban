<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สร้างไอคอนสีทอง ศกศ.ตราด</title>
  <style>
    body { background: #1e293b; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; }
    canvas { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    button { background: #f59e0b; color: #000; font-weight: bold; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #d97706; }
  </style>
</head>
<body>
  <h2>✨ พรีวิวไอคอนสีทอง 3D (512x512 px)</h2>
  <canvas id="iconCanvas" width="512" height="512"></canvas>
  <button onclick="downloadIcon()">⬇️ ดาวน์โหลดไฟล์ logo.png</button>

  <script>
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');

    // 1. วาดพื้นหลังสีทองไล่ระดับแบบ 3D Luxury Metallic
    const gradient = ctx.createRadialGradient(180, 150, 40, 256, 256, 320);
    gradient.addColorStop(0, '#FFF6D6');   // แสงไฮไลต์สีทองสว่าง
    gradient.addColorStop(0.35, '#F5C042'); // สีทองแท้
    gradient.addColorStop(0.75, '#D48B16'); // สีทองเข้ม
    gradient.addColorStop(1, '#9E5B00');    // เงาสีทองขอบมิติ 3D

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 512, 512);

    // 2. เติมขอบแสงสะท้อนบางเฉียบ (Inner Glow)
    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, 506, 506);

    // 3. โหลดภาพตราและย่อขนาดให้อยู่ใน Safe Zone 75% ป้องกันขอบล้น
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = "https://lh3.googleusercontent.com/d/1kLyYDJNV7hYAD0YERRxW8GEgJNB-XplP";

    img.onload = () => {
      const targetHeight = 390; // ย่อขนาดให้อยู่ในระยะปลอดภัย
      const targetWidth = (img.width / img.height) * targetHeight;
      const x = (512 - targetWidth) / 2;
      const y = (512 - targetHeight) / 2;

      // เพิ่มมิติเงาตกกระทบให้ตัวตราลอยเด่น (3D Drop Shadow)
      ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 10;

      ctx.drawImage(img, x, y, targetWidth, targetHeight);
    };

    function downloadIcon() {
      const link = document.createElement('a');
      link.download = 'logo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
